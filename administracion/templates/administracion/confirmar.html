{% extends "core/base.html" %}

{% block titulo %}{{ titulo }} - SIREP{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 fw-semibold">{{ titulo }}</h4>
</div>

<div class="card shadow-sm border-warning" style="max-width: 480px;">
    <div class="card-body p-4">
        <div class="d-flex align-items-start gap-3 mb-4">
            <i class="bi bi-exclamation-triangle-fill text-warning fs-3 mt-1"></i>
            <div>
                <p class="mb-1">{{ pregunta }}</p>
                <small class="text-muted">{{ aviso }}</small>
            </div>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning d-flex align-items-center gap-2">
                    <i class="bi bi-slash-circle"></i> {{ boton }}
                </button>
                {% if cancelar_id %}
                    <a href="{% url cancelar_url cancelar_id %}" class="btn btn-outline-secondary">Cancelar</a>
                {% else %}
                    <a href="{% url cancelar_url %}" class="btn btn-outline-secondary">Cancelar</a>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
