{% extends "core/base.html" %}

{% block titulo %}{{ accion }} categoría - SIREP{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 fw-semibold">{{ accion }} categoría</h4>
    <a href="{% url 'administracion:lista_categorias' %}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2"><i class="bi bi-arrow-left"></i> Volver</a>
</div>
<div class="card shadow-sm mx-auto" style="max-width: 480px;">
    <div class="card-body p-4">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "administracion/_campo.html" with campo=form.nombre %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary d-flex align-items-center gap-2"><i class="bi bi-check-lg"></i> {{ accion }}</button>
                <a href="{% url 'administracion:lista_categorias' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
