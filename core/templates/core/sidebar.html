<aside id="sidebar" class="app-sidebar d-flex flex-column" aria-label="Navegación principal">
    <div class="sidebar-marca">
        <a href="{% url 'core:home' %}" class="sidebar-logo" aria-label="SIREP, inicio">
            <span class="marca-icono"><i class="bi bi-cup-hot" aria-hidden="true"></i></span>
            <span class="sidebar-label"><strong>SIREP</strong><small>Gestión de restaurante</small></span>
        </a>
        <button id="sidebar-toggle" class="sidebar-colapsar" aria-label="Contraer o expandir menú" aria-expanded="true">
            <i class="bi bi-chevron-left sidebar-chevron d-none d-md-inline" aria-hidden="true"></i><i class="bi bi-x-lg d-md-none" aria-hidden="true"></i>
        </button>
    </div>
    <nav class="sidebar-navegacion flex-grow-1">
        <p class="sidebar-seccion">ESPACIO DE TRABAJO</p>
        <a href="{% url 'core:home' %}" class="sidebar-link {% if request.resolver_match.view_name == 'core:home' %}active{% endif %}" {% if request.resolver_match.view_name == 'core:home' %}aria-current="page"{% endif %} title="Inicio">
            <span class="sidebar-item-icono"><i class="bi bi-house-door" aria-hidden="true"></i></span><span class="sidebar-label">Inicio</span>
        </a>
        <p class="sidebar-seccion mt-4">MÓDULOS</p>
        {% for modulo in modulos_navegacion %}
        <a href="{{ modulo.url }}" class="sidebar-link {% if modulo_actual == modulo.clave %}active{% endif %}" {% if modulo_actual == modulo.clave %}aria-current="page"{% endif %} title="{{ modulo.nombre }}">
            <span class="sidebar-item-icono"><i class="bi {{ modulo.icono }}" aria-hidden="true"></i></span><span class="sidebar-label">{{ modulo.nombre }}</span>
            <i class="bi bi-chevron-right sidebar-label sidebar-flecha" aria-hidden="true"></i>
        </a>
        {% endfor %}
    </nav>
    <div class="sidebar-pie">
        <a href="{% url 'seguridad:mi_perfil' %}" class="sidebar-link sidebar-perfil" title="Mi perfil">
            <span class="perfil-mini-avatar">{{ user.username|slice:":1"|upper }}</span>
            <span class="sidebar-label overflow-hidden"><strong class="d-block text-truncate">{{ user.get_short_name|default:user.username }}</strong><small>Mi perfil</small></span>
        </a>
        <form method="post" action="{% url 'seguridad:logout' %}">
            {% csrf_token %}
            <button class="sidebar-link sidebar-salir w-100" type="submit" title="Cerrar sesión"><span class="sidebar-item-icono"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></span><span class="sidebar-label">Cerrar sesión</span></button>
        </form>
    </div>
</aside>
